services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_interviewer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - apps/backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_interviewer
      FRONTEND_ORIGIN: http://localhost:3000
      # Left unset (not "production") deliberately: NODE_ENV=production makes
      # the session cookie Secure, which real HTTPS-fronted deployments need
      # (the browser sees https:// even though the platform forwards plain
      # HTTP internally) but which breaks cookie persistence here, where the
      # browser talks to this container directly over plain HTTP with no TLS
      # anywhere in the path.
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      BUN_PUBLIC_BACKEND_URL: http://localhost:3001
    depends_on:
      - backend

volumes:
  postgres-data:
